services:
  - type: web
    name: workoutzone
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workoutzone-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://gymdashboard-1.onrender.com/auth/callback
      - key: FRONTEND_URL
        value: https://gymdashboard-1.onrender.com
      - key: PRODUCTION
        value: "true"
    healthCheckPath: /api
    autoDeploy: true

databases:
  - name: workoutzone-db
    plan: free
    databaseName: workoutzone
